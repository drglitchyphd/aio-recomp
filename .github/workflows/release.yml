name: Package mod release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching manifest version (e.g. v0.9.49)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Existing release tag matching manifest version
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: mod-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Check version and list previous releases
        run: |
          python3 - <<'PY'
          import json, os
          version = json.load(open('manifest.json'))['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match manifest.json (vX.Y.Z)'
          PY
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --slurp > /tmp/release-pages.json
      - name: Select previous complete build
        # A full-install release (new mod id or new major version, e.g. 1.0.0
        # Crystal-AiO) ships only the full ZIP; any other release also ships
        # an overlay patch against the newest older full build of this id.
        run: |
          python3 - <<'PY'
          import json, os
          from tools.build_mod_index import select_release
          from tools.build_release import semver
          manifest = json.load(open('manifest.json'))
          version = semver(manifest['version'])
          releases = [r for page in json.load(open('/tmp/release-pages.json')) for r in page]
          older = []
          for release in releases:
              try:
                  if semver(release['tag_name'].removeprefix('v')) < version:
                      older.append(release)
              except ValueError:
                  pass
          selected = select_release(older, manifest['id'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              if not selected:
                  print(f"No earlier {manifest['id']} release: full-install release")
                  env.write('FULL_INSTALL=1\n')
              elif semver(selected['version'])[0] < version[0]:
                  print(f"Major version {semver(selected['version'])[0]} -> {version[0]}: full-install release")
                  env.write('FULL_INSTALL=1\n')
              else:
                  json.dump(selected, open('/tmp/previous-release.json', 'w'))
          PY
          if [ -z "${FULL_INSTALL:-}" ] && [ -f /tmp/previous-release.json ]; then
            previous_tag=$(python3 -c 'import json; print(json.load(open("/tmp/previous-release.json"))["tag"])')
            previous_name=$(python3 -c 'import json; print(json.load(open("/tmp/previous-release.json"))["zip"]["name"])')
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern "$previous_name" --output /tmp/previous.zip
          fi
      - name: Build and verify full build (and overlay patch)
        run: |
          if [ -f /tmp/previous.zip ]; then
            python3 tools/build_release.py --tag "$RELEASE_TAG" --previous-zip /tmp/previous.zip
          else
            python3 tools/build_release.py --tag "$RELEASE_TAG" --full-install
          fi
      - name: Attach installable builds and checksums
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
  index:
    needs: package
    uses: ./.github/workflows/mod-index.yml
    permissions:
      contents: write
